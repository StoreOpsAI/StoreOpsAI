[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "storeops-demand"
version = "0.1.0"
description = "SRS-based demand forecasting and approval-only order drafts"
requires-python = ">=3.11"
dependencies = ["pandas==3.0.6", "xgboost-cpu==3.4.1", "scikit-learn==1.9.1", "fastapi==0.141.1", "uvicorn==0.53.0"]
[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
[tool.setuptools]
packages = ["storeops"]
[tool.setuptools.package-data]
storeops = ["ui.html"]
[tool.pytest.ini_options]
testpaths = ["tests"]
