<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoreOps 발주 추천</title><style>body{font:16px system-ui;background:#f4f6fa;color:#192a38;max-width:1050px;margin:35px auto;padding:0 20px}section{background:white;padding:24px;border-radius:12px;margin:20px 0}h1{margin-bottom:6px}label{display:inline-block;margin:8px}input,button{font:inherit;padding:9px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer;background:#123f64;color:white;margin:5px}input[type=number]{width:90px}input[type=password]{width:230px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.notice{color:#704800;background:#fff1cf;padding:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}.tag{font-size:13px;color:#555}</style><h1>StoreOps · 수요 예측과 발주</h1><p>내일·모레 예상 수요를 확인하고 승인 초안을 저장합니다.</p><p class="notice">추천량이 품절 방지를 보장하지 않습니다. 승인해도 공급사에 주문이 전송되지 않으며, 재고·도착 예정은 변경되지 않습니다.</p><section><label>접근 토큰 <input id="token" type="password" placeholder="점주 토큰 입력" autocomplete="off"></label><p class="tag">로컬 시연 모드의 토큰: demo-owner-s01</p><label>현재 재고 <input id="stock" type="number" min="0" step="1" value="15"></label><label>도착 예정 <input id="incoming" type="number" min="0" step="1" value="0"></label><p class="tag">이 화면의 기본 조건: 안전재고 10개, 박스 6개. 기존 도착 예정은 내일 시작 시 입고, 신규 주문은 모레 영업 종료 후 도착한다고 가정합니다.</p><button id="forecast">M5 예측으로 추천 생성</button><button id="mock">P001 명세서 모의 예시 생성</button><button id="refresh">목록 새로고침</button><p id="message" role="status"></p><pre id="result"></pre></section><section><h2>발주 추천·승인 기록</h2><div id="drafts"></div></section><p><a href="/docs">API 명세·직접 호출</a></p><script>
const $=id=>document.getElementById(id);let busy=false;
async function api(path,method='GET',body,key){const headers={'Authorization':'Bearer '+$('token').value,'Content-Type':'application/json'};if(key)headers['Idempotency-Key']=key;const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw new Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
async function action(fn){if(busy)return;busy=true;$('message').textContent='처리 중…';try{await fn();$('message').textContent='완료'}catch(e){$('message').textContent=e.message}finally{busy=false}}
function integer(id){const n=Number($(id).value);if(!Number.isInteger(n)||n<0||$(id).value==='')throw Error('재고는 0 이상의 정수로 입력하세요.');return n}
function show(value){$('result').textContent=JSON.stringify(value,null,2)}
async function refresh(){const list=await api('/api/orders/drafts');$('drafts').replaceChildren();if(!list.length){$('drafts').textContent='저장된 초안이 없습니다.';return}for(const d of list){const box=document.createElement('section'),title=document.createElement('h3');title.textContent=d.product_id+' · '+(d.data_label==='synthetic'?'합성·모의 자료':'공개 판매 자료 기반');box.append(title);const p=document.createElement('p');p.textContent=`${d.target_date}부터 | 내일 ${d.forecast.d1.toFixed(2)}개 · 모레 ${d.forecast.d2.toFixed(2)}개 | 추천 ${d.recommended.qty}개 (${d.recommended.boxes}박스) | 도착 전 부족 ${d.shortage_before_arrival.toFixed(2)}개`;box.append(p);if(d.approved){const a=document.createElement('p');a.textContent=`승인 초안 저장: ${d.approved.qty}개 (${d.approved.boxes}박스) · ${d.approved.by} · ${d.approved.at} · 공급사 전송 안 함`;box.append(a)}else{const input=document.createElement('input');input.type='number';input.min='0';input.step=d.pack_size;input.value=d.recommended.qty;input.setAttribute('aria-label',d.product_id+' 승인 수량');box.append(input);const b=document.createElement('button');b.textContent='수정 수량으로 승인 초안 저장';b.onclick=()=>action(async()=>{const qty=Number(input.value);if(!Number.isInteger(qty)||qty<0||qty%d.pack_size||input.value==='')throw Error(d.pack_size+'개 배수로 입력하세요.');show(await api('/api/orders/drafts/'+d.draft_id+'/approve','POST',{qty}));await refresh()});box.append(b)}$('drafts').append(box)}}
$('refresh').onclick=()=>action(refresh);
$('forecast').onclick=()=>action(async()=>{const demand=await api('/api/demo/forecast-input');show(await api('/api/orders/forecast-draft','POST',{demand,on_hand:integer('stock'),incoming:integer('incoming')},crypto.randomUUID()));await refresh()});
$('mock').onclick=()=>action(async()=>{show(await api('/api/orders/drafts','POST',{product_id:'P001',target_date:'2026-03-15',d1:16,d2:12,on_hand:integer('stock'),incoming:integer('incoming'),data_label:'synthetic',forecast_source:'mock'},crypto.randomUUID()));await refresh()});
</script></html>
