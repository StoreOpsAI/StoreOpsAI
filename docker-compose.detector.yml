# 탐지 PC는 다른 PC의 Compose 서비스명 대신 백엔드의 Tailscale 주소를 사용합니다.
services:
  storeops-ai:
    build:
      context: ./storeops_ai
    restart: unless-stopped
    env_file:
      - path: ./storeops_ai/.env
        required: false
    environment:
      ALERT_WEBHOOK_URL: ${BACKEND_EVENTS_URL:?백엔드 사건 API 주소를 설정하세요}
      VLM_RESULT_WEBHOOK_URL: ${BACKEND_VLM_URL:?백엔드 VLM 콜백 주소를 설정하세요}
      EVENT_INGEST_TOKEN: ${STOREOPS_AI_INGEST_TOKEN:?탐지 서비스 토큰을 설정하세요}
      STOREOPS_MEDIA_UPLOAD_ENABLED: "1"
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ./storeops_ai/input:/app/input
      - ./storeops_ai/output:/app/output
