services:
  postgres:
    image: postgres:16
    container_name: storeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storeops
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops_dev_password
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - storeops_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops -d storeops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: storeops-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://storeops:storeops_dev_password@postgres:5432/storeops
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_COOKIE_SECURE: "false"
      STOREOPS_DEMAND_URL: http://demand:8765
      STOREOPS_QNA_URL: http://qna-agent:8002
      STOREOPS_QNA_TOKEN: ${STOREOPS_QNA_TOKEN:?질문 서비스 공유 토큰을 설정하세요}
      STOREOPS_DEMAND_TOKENS_JSON: ${STOREOPS_DEMAND_TOKENS_JSON:?매장별 수요 서비스 토큰 매핑을 설정하세요}
      STOREOPS_AI_INGEST_TOKENS_JSON: ${STOREOPS_AI_INGEST_TOKENS_JSON:?매장별 탐지 토큰 매핑을 설정하세요}
    ports:
      - "8000:8000"
    volumes:
      - ./storeops_ai/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      qna-agent:
        condition: service_healthy

  demand:
    build:
      context: ./storeops-demand
    container_name: storeops-demand
    restart: unless-stopped
    environment:
      STOREOPS_DEMO: "1"
    ports:
      - "8765:8765"
    volumes:
      - ./storeops-demand/runtime:/app/runtime

  storeops-ai:
    build:
      context: ./storeops_ai
    container_name: storeops-ai-detector
    restart: unless-stopped
    env_file:
      - path: ./storeops_ai/.env
        required: false
    environment:
      ALERT_WEBHOOK_URL: http://backend:8000/api/internal/events
      VLM_RESULT_WEBHOOK_URL: http://backend:8000/api/internal/events/{event_id}/vlm
      QWEN_VLM_BASE_URL: http://qwen-vllm:8000/v1
      EVENT_INGEST_TOKEN: ${STOREOPS_AI_INGEST_TOKEN:?탐지 서비스 토큰을 설정하세요}
      STOREOPS_BACKEND_URL: http://backend:8000
    ports:
      - "8100:8000"
    volumes:
      - ./storeops_ai/input:/app/input
      - ./storeops_ai/output:/app/output
    depends_on:
      backend:
        condition: service_started
      qwen-vllm:
        condition: service_healthy

  qwen-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    container_name: storeops-qwen-vllm
    restart: unless-stopped
    gpus: all
    shm_size: 8gb
    command:
      - --model
      - ${QWEN_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-mm-per-prompt
      - '{"image":3,"video":0}'
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - qwen_vlm_hf_cache:/root/.cache/huggingface
      - qwen_vlm_compile_cache:/root/.cache/vllm
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 3m

  qna-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: storeops-qna-llm
    restart: unless-stopped
    command:
      - --model
      - /models/qwen.gguf
      - --alias
      - qwen3.6-35b-a3b
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --ctx-size
      - ${QNA_LLM_CONTEXT_SIZE:-16384}
      - --n-gpu-layers
      - "0"
      - --jinja
    ports:
      - "127.0.0.1:8003:8000"
    volumes:
      - type: bind
        source: ${QNA_LLM_MODEL_PATH:-C:/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf}
        target: /models/qwen.gguf
        read_only: true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 2m

  qna-agent:
    build:
      context: ./storeops_qna
    container_name: storeops-qna-agent
    restart: unless-stopped
    environment:
      STOREOPS_QNA_TOKEN: ${STOREOPS_QNA_TOKEN:?질문 서비스 공유 토큰을 설정하세요}
      STOREOPS_QNA_LLM_URL: http://qna-llm:8000/v1
      STOREOPS_QNA_DB_PATH: /app/qna_data/storeops.db
    ports:
      - "127.0.0.1:8002:8002"
    volumes:
      - type: bind
        source: ./storeops_qna/storeops.db
        target: /app/qna_data/storeops.db
        bind:
          create_host_path: false
      - qna_agent_hf_cache:/root/.cache/huggingface
    depends_on:
      qna-llm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/openapi.json', timeout=5); urllib.request.urlopen('http://qna-llm:8000/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 2m

  frontend:
    build:
      context: ./frontend
    container_name: storeops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
      storeops-ai:
        condition: service_started

volumes:
  storeops_postgres_data:
  qwen_vlm_hf_cache:
  qwen_vlm_compile_cache:
  qna_agent_hf_cache:
