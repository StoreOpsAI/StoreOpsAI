services:
  postgres:
    image: postgres:16
    container_name: storeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storeops
      POSTGRES_USER: storeops
      POSTGRES_PASSWORD: storeops_dev_password
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5433:5432"
    volumes:
      - storeops_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeops -d storeops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: storeops-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux Docker에서도 호스트의 실시간 화면 서버에 닿게
    environment:
      DATABASE_URL: postgresql://storeops:storeops_dev_password@postgres:5432/storeops
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_COOKIE_SECURE: "false"
      STOREOPS_DEMAND_URL: http://demand:8765
      STOREOPS_QNA_URL: ${STOREOPS_QNA_URL:?상대 PC의 qna-1 주소를 설정하세요}
      STOREOPS_QNA_TOKEN: ${STOREOPS_QNA_TOKEN:?질문 서비스 공유 토큰을 설정하세요}
      STOREOPS_DEMAND_TOKENS_JSON: ${STOREOPS_DEMAND_TOKENS_JSON:?매장별 수요 서비스 토큰 매핑을 설정하세요}
      STOREOPS_AI_INGEST_TOKENS_JSON: ${STOREOPS_AI_INGEST_TOKENS_JSON:?매장별 탐지 토큰 매핑을 설정하세요}
      STOREOPS_AI_URL: http://storeops-ai:8000
      # 실시간 화면: 탐지는 웹캠을 직접 여는 호스트 프로그램(pipelines/path1_webcam.py)이라 호스트 주소로 부른다
      STOREOPS_AI_LIVE_URL: ${STOREOPS_AI_LIVE_URL:-http://host.docker.internal:8101}
      # 점주가 지난 사건을 물을 때 질문 Agent 요청으로 대표 이미지를 해석하는 VLM 서버(사건 시점에는 호출하지 않음)
      QWEN_VLM_BASE_URL: http://qwen-vllm:8000/v1
      QWEN_VLM_MODEL: ${QWEN_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}
    ports:
      - "8000:8000"
    volumes:
      - ./storeops_ai/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy

  demand:
    build:
      context: ./storeops-demand
    container_name: storeops-demand
    restart: unless-stopped
    environment:
      STOREOPS_DEMO: "1"
    ports:
      - "8765:8765"
    volumes:
      - ./storeops-demand/runtime:/app/runtime

  storeops-ai:
    build:
      context: ./storeops_ai
    container_name: storeops-ai-detector
    restart: unless-stopped
    env_file:
      - path: ./storeops_ai/.env
        required: false
    environment:
      ALERT_WEBHOOK_URL: http://backend:8000/api/internal/events
      VLM_RESULT_WEBHOOK_URL: http://backend:8000/api/internal/events/{event_id}/vlm
      QWEN_VLM_BASE_URL: http://qwen-vllm:8000/v1
      # 경보 후보가 났을 때만 클립 프레임을 VLM에 보내 "그 행동이 맞다"고 할 때만 백엔드로 최종 경보를 보냅니다(utils/vlm_gate.py).
      # 10초 묶음마다 VLM을 부르지 않습니다. 사건 뒤 설명(VLM_ON_EVENT)은 끕니다.
      VLM_ON_EVENT: "0"
      VLM_GATE_ENABLED: "1"
      EVENT_INGEST_TOKEN: ${STOREOPS_AI_INGEST_TOKEN:?탐지 서비스 토큰을 설정하세요}
      STOREOPS_BACKEND_URL: http://backend:8000
    ports:
      - "8100:8000"
    volumes:
      - ./storeops_ai/input:/app/input
      - ./storeops_ai/output:/app/output
    depends_on:
      backend:
        condition: service_started

  qwen-vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    container_name: qwen-vllm
    restart: unless-stopped
    gpus: all
    shm_size: 8gb
    command:
      - --model
      - ${QWEN_VLM_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --limit-mm-per-prompt
      - '{"image":3,"video":0}'
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
    ports:
      - "8001:8000"
    volumes:
      - qwen_vlm_hf_cache:/root/.cache/huggingface
      - qwen_vlm_compile_cache:/root/.cache/vllm
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 3m

  frontend:
    build:
      context: ./frontend
    container_name: storeops-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
      storeops-ai:
        condition: service_started

volumes:
  storeops_postgres_data:
  qwen_vlm_hf_cache:
  qwen_vlm_compile_cache:
