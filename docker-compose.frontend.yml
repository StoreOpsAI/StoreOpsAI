# 원격 백엔드를 사용하는 프런트 PC 전용 구성입니다.
services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:?백엔드의 HTTPS 기본 주소를 설정하세요}
    ports:
      - "127.0.0.1:5173:80"
    volumes:
      - ./frontend/nginx.remote.conf.template:/etc/nginx/templates/default.conf.template:ro
