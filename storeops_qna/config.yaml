# StoreOps AI · 3.3 질문 파트 설정 (NFR-13: 코드를 고치지 않고 여기서 바꿉니다)

llm:
  base_url: "http://127.0.0.1:8001/v1" # llama-server 주소
  model: "qwen3.6-35b-a3b" # llama-server --alias 와 같아야 함
  api_key: "sk-no-key-required"
  enable_thinking: false # 도구 호출 Agent는 비사고 모드가 빠르고 안정적 (true로 바꾸면 사고 모드)
  temperature: 0.3 # 이 팀의 선택값. Qwen 공식 비사고 권장은 0.7 / top_p 0.8 / top_k 20
  top_p: 0.8
  top_k: 20
  presence_penalty: 0.0 # 도구 인자(E015 등)가 반복되므로 0으로 둠
  max_tokens: 1024
  timeout_sec: 180

agent:
  max_tool_calls: 5 # FR-QNA-11: 전체 호출이 5회를 넘으면 멈춤 (제안값, 2주차 확정)
  max_consecutive_failures: 2 # FR-QNA-11: 같은 도구 연속 2회 실패하면 멈춤
  timezone_offset_hours: 9 # 한국 시간 (UTC+9)
  # 실제 질문은 현재 한국 시간을 기준으로 날짜 범위를 계산합니다.
  demo_now: null

owners: # 로그인 대신 쓰는 시연용 점주→매장 매핑 (FR-QNA-12)
  owner-01: S01

manual:
  doc_path: "M001_StoreOps_AI_매장점검규정_v0.1.md"
  max_chunk_chars: 700
  top_k: 3
  similarity_threshold: 0.45 # 가까움 기준: 미정(4주차). 질문 평가셋(D16)으로 보정하세요.

embedding:
  backend: "bge-m3" # "bge-m3" | "hash"(테스트용, 의미 검색 아님)
  model_name: "BAAI/bge-m3"

db:
  path: "storeops.db"
